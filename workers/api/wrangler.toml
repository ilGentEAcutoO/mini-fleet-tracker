# fleet-api — the Container Worker that wraps the Go Fiber backend.
#
# Pattern: a small TypeScript Worker exports a class extending
# @cloudflare/containers.Container; wrangler builds the image from the
# backend/Dockerfile and pushes to the CF managed registry on `wrangler
# deploy`. The gateway Worker forwards /api/* and /ws/* (post-DO upgrade
# misses) here via a service binding instead of HTTP fetch.
#
# Cost: max_instances=1 + sleepAfter on the class means the container
# hibernates between requests. Total spend stays bounded by the
# hard-expiration on 2026-05-31 (see TASK-030).
name = "fleet-api"
main = "src/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

[[containers]]
class_name = "FleetAPI"
image = "../../backend/Dockerfile"
max_instances = 1
# Build arg passed through to backend/Dockerfile's `ARG GIT_COMMIT`,
# which threads it into `go build -ldflags "-X main.gitCommit=..."`. The
# resulting binary surfaces the SHA in /healthz responses so operators
# can confirm which build is live. Sentinel value "dev" is overwritten
# by api/deploy.mjs before invoking `wrangler deploy`; if you see
# "dev" in a production response you bypassed the deploy wrapper.
image_vars = { GIT_COMMIT = "dev" }

[[durable_objects.bindings]]
name = "FLEET_API"
class_name = "FleetAPI"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FleetAPI"]

# Non-sensitive env vars exposed to the container via the Container
# class's envVars field (see src/index.ts). Sensitive values arrive via
# `wrangler secret put` — they reach the container through the same
# bridge but are never echoed in deploys / logs.
[vars]
APP_ENV = "production"
PORT = "8080"
LOG_LEVEL = "info"
CORS_ORIGIN = "https://fleet-tracker.jairukchan.com"
