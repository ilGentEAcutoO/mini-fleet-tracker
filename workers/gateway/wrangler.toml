# fleet-worker-gateway — the public edge router.
#
# Fronts fleet-tracker.jairukchan.com. Forwards /api/* to the Go API,
# upgrades /ws/* to the FleetHub Durable Object, and HMAC-verifies
# /internal/publish before relaying it to the DO.
name = "fleet-worker-gateway"
main = "src/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

# The gateway holds a binding to the DO declared in fleet-hub/wrangler.toml.
# `script_name` is required because the class is defined in a different
# worker (cross-script binding). The class_name must match exactly.
[[durable_objects.bindings]]
name = "FLEET_HUB"
class_name = "FleetHub"
script_name = "fleet-do-hub"

# `[[routes]]` table-array (not inline `routes = [...]`): an inline routes
# array placed after a section header gets re-parented under that section
# by the TOML parser and silently no-ops on deploy. Same gotcha documented
# in frontend/wrangler.toml.
[[routes]]
pattern = "fleet-tracker.jairukchan.com/api/*"
zone_name = "jairukchan.com"

[[routes]]
pattern = "fleet-tracker.jairukchan.com/ws/*"
zone_name = "jairukchan.com"

# Service binding to the fleet-api Container Worker — intra-CF, no DNS
# hop, no loop-detection 404 that workers.dev URLs get when fetched from
# another worker in the same account. Replaces the previous HTTPS fetch
# to env.API_UPSTREAM_URL.
[[services]]
binding = "FLEET_API"
service = "fleet-api"

# TASK-050 — Workers Rate Limiting binding for /ws/* upgrade defence.
# 3 attempts per IP per 60s. Returning 429 + Retry-After: 60 from the
# gateway means an attacker hammering /ws/* with malformed cookies stops
# burning HMAC import + JWT verify on the DO. The GA `[[ratelimits]]`
# syntax replaces the older `[[unsafe.bindings]]` form (GA since 2025-09).
# namespace_id is a positive integer unique within this account — 1001
# is chosen first-come (no existing ratelimits in this project's tree).
# Per CF docs IP keys are noisier than per-user keys (carrier NAT, etc.)
# but that's the documented spec for this defence: keep the gate cheap
# and burn the noise budget on attackers, not on per-user logic.
[[ratelimits]]
name = "WS_RL"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 3
  period = 60

[vars]
# Kept as a dev fallback only. Production traffic always goes through
# env.FLEET_API service binding above; this var is read only when the
# binding is unavailable (local `wrangler dev` without --services).
API_UPSTREAM_URL = "http://localhost:8080"
# Single-origin posture (security-review.md M1 / TASK-048): only the two
# canonical origins are echoed back. The workers.dev preview URL was
# dropped because neither fleet-hub DO nor the backend's CORS_ORIGIN
# accepted it, so keeping the gateway more lenient was inconsistent.
ALLOWED_ORIGINS = "http://localhost:3000,https://fleet-tracker.jairukchan.com"

# Secrets: JWT_SECRET, INTERNAL_PUBLISH_SECRET
# Loaded from .dev.vars locally; `wrangler secret put` in prod.

# [observability]
# enabled = true
