# Build scripts were never run under pnpm 10 (no onlyBuiltDependencies); keep that.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false
# pnpm >= 10 reads overrides from here (pnpm 11 ignores package.json "pnpm.overrides").
# Security pins for transitive dependencies — see Dependabot alerts.
overrides:
  '@nuxt/devtools': '3.4.3'
  tar: '>=7.5.19'
  shell-quote: '>=1.11.0'
  brace-expansion: '>=5.0.12'
  hono: '>=4.13.7'
  fast-uri: '>=4.1.5'
  ip-address: '>=10.7.1'
  undici: '>=8.10.2'
  postcss: '>=8.5.18'
  js-yaml: '>=5.4.1'
  sharp: '>=0.35.5'
  svgo: '>=4.1.0'
  ws: '>=8.21.0'
  vite: '>=7.3.5'
  launch-editor: '>=2.14.1'
  esbuild: '>=0.28.1'
  '@babel/core': '>=7.29.6'
  body-parser: '>=2.3.0'
  '@hono/node-server': '>=2.0.5'
  nuxt: '>=4.6.2'
  '@modelcontextprotocol/sdk': '^1.31.0'
  '@simple-git/argv-parser': '>=2.0.1'
  baseline-browser-mapping: '>=2.11.0'
  browserslist: '>=4.28.7'
  decode-uri-component: '>=0.5.0'
  devalue: '^5.9.3'
  postcss-selector-parser: '>=7.1.6'
  proxy-addr: '>=2.0.8'
  qs: '>=6.16.0'
  seroval: '>=1.6.3'
  source-map-js: '>=1.2.2'
